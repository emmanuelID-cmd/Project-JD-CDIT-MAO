<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>CDIT Support Desk</title><link rel="stylesheet" href="/assets/app.css"></head>
<body>
<div class="app-frame"><aside class="sidebar"><a class="brand" href="/"><span class="brand-mark">C</span><span>CDIT <b>Support Desk</b></span></a><div class="workspace-label" id="workspace-label"></div><nav class="side-nav" id="side-nav"></nav><div class="sidebar-bottom"><div class="privacy-note"><span>◉</span><div><b>Protected workspace</b><small>Synthetic records. Human review required.</small></div></div><div class="side-link"><a href="/preview/user">Role showcase ↗</a></div></div></aside>
<main class="main-column"><header class="topbar"><div class="mobile-brand"><span class="brand-mark">C</span> CDIT Support Desk</div><div class="topbar-right"><span class="env-pill"><i></i> Synthetic prototype</span><span class="user-chip"><span class="avatar" id="avatar">U</span><span><b id="actor-name">Loading</b><small id="actor-role"></small></span></span><button class="icon-button" id="logout" aria-label="Sign out" title="Sign out">⇥</button></div></header>
<div class="content"><section class="welcome-row"><div><div class="eyebrow" id="crumb"></div><h1 id="page-title"></h1><p class="muted" id="page-description"></p></div><div class="date-chip" id="today"></div></section><section class="metrics-row" id="metrics"></section><div id="view-content"></div><footer class="page-footer">CDIT Support Desk <span>•</span> Local synthetic prototype <span>•</span> No agent ticket writes</footer></div></main></div>
<div id="session-modal" class="modal-backdrop" hidden><section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="session-title"><div class="modal-icon">◷</div><div class="eyebrow">SESSION REMINDER</div><h2 id="session-title">Your session is nearing its limit</h2><p id="session-copy" class="muted"></p><div class="modal-actions"><button id="session-logout" class="button secondary">Sign out</button><button id="session-extend-request" class="button quiet">Request Admin review</button><button id="session-continue" class="button primary">Stay signed in</button></div><div id="session-message" class="form-message" role="status" aria-live="polite"></div></section></div>
<script src="/assets/app.js" defer></script></body></html>
