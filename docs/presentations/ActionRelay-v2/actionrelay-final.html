@media(max-width:850px){.shell{grid-template-columns:1fr}.rail{padding:8px 14px;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;align-items:center}.rail button{width:auto;margin:0}.rail .eyebrow{padding:0 5px}}
@media(max-width:620px){.split,.login,.workspace.expanded{grid-template-columns:1fr}.intro{min-height:0;gap:18px}.grid{gap:7px}.metric{padding:11px}.metric b{font-size:24px}.hero{padding:18px}.top{gap:12px}.switch button{padding:7px 10px}}
.flag{background:#443321;color:#ffd798}.scroll table{min-width:720px}.filters{grid-template-columns:repeat(auto-fit,minmax(min(145px,100%),1fr))}
.case-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0}
.case-fields div{padding:10px 12px;border:1px solid var(--line);border-radius:9px}
.case-fields dt{color:var(--muted);font-size:12px}.case-fields dd{margin:3px 0 0;overflow-wrap:anywhere}
.review-panel{border-top:1px solid var(--line);padding-top:16px}.review-panel textarea{min-height:110px}
@media(max-width:620px){.case-fields{grid-template-columns:1fr}}
.feedback-flag{display:flex;align-items:center;gap:8px}.feedback-flag input{width:auto}
 .current-decision{border:2px solid var(--mint);border-radius:12px;background:#142d36;padding:16px}
.current-decision h3{color:var(--mint)}.trend-panel{margin-bottom:14px;background:linear-gradient(145deg,#182a42,#131e30)}
.trend-controls{margin-top:4px}.trend-chart{min-width:0;overflow-x:auto}.trend-bars{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(48px,1fr);gap:8px;list-style:none;margin:0;padding:4px 2px}
.trend-bars li{display:grid;grid-template-rows:22px 105px auto;text-align:center;min-width:0;gap:3px}
.trend-bars b{font-variant-numeric:tabular-nums}.trend-track{display:flex;align-items:end;background:#1e3049;border-radius:5px;overflow:hidden}
.trend-track span{width:100%;background:linear-gradient(#7ce8cd,#4d91b9);border-radius:5px 5px 0 0}
.trend-bars small{white-space:nowrap}.trend-summary{display:flex;flex-wrap:wrap;gap:8px}

/* Richer surfaces with a separate, consistent palette for attention bands. */
body{background:
  radial-gradient(ellipse at 12% 7%,#193c56 0%,transparent 42%),
  radial-gradient(ellipse at 88% 19%,#382752 0%,transparent 38%),
  radial-gradient(ellipse at 65% 96%,#103c3f 0%,transparent 46%),#09111f;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#8fa9d926 1px,transparent 1px);background-size:23px 23px;mask-image:linear-gradient(#000,transparent 84%);z-index:-1}
body{isolation:isolate}.top{background:#111a2ef2;border-color:#41506b}.rail{background:#0e1829e8}
.hero{background:radial-gradient(ellipse at top right,#473363 0%,transparent 60%),linear-gradient(115deg,#153a47,#20243d);border-color:#536681}
.card{box-shadow:0 12px 24px #050b1740}
.metric:nth-child(3n+1){background:linear-gradient(145deg,#17414b,#142636);border-color:#3d7580}
.metric:nth-child(3n+2){background:linear-gradient(145deg,#342654,#1d253d);border-color:#6a5488}
.metric:nth-child(3n+3){background:linear-gradient(145deg,#493047,#26233e);border-color:#815675}
.metric .eyebrow{color:#f4e9ff}
.filter-card{background:linear-gradient(125deg,#1b2d4d,#192037);border-color:#435a80}
.chart-card[data-chart="band"]{background:linear-gradient(145deg,#173b43,#152637);border-color:#3b7279}
.chart-card[data-chart="category"]{background:linear-gradient(145deg,#392855,#23233f);border-color:#6d5688}
.chart-card[data-chart="status"]{background:linear-gradient(145deg,#203b60,#172942);border-color:#4d6f98}
.chart-card[data-chart="issue"]{background:linear-gradient(145deg,#503044,#2a233b);border-color:#80566e}
.trend-panel{background:linear-gradient(145deg,#243d63,#202743 58%,#24253e);border-color:#526c97}
.queue-card{background:linear-gradient(145deg,#183344,#16243a);border-color:#3b5e77}
.queue-row{background:color-mix(in srgb,var(--case-color) 14%,#142238)}
.queue-row td:first-child{border-inline-start:4px solid var(--case-color)}
.queue-row:hover,.queue-row:focus-within{background:color-mix(in srgb,var(--case-color) 23%,#142238)}
.queue-row button.link{color:#eaf7ff}
.high{color:#ffd1dc;background:#6a2844;border-color:#e2769c}
.medium{color:#ffe5a8;background:#5c3d20;border-color:#efb95f}
.low{color:#bdffeb;background:#155248;border-color:#60ddbc}
.unknown{color:#edddff;background:#4b3272;border-color:#bd9af2}
.trend-chart{scrollbar-color:#7e96bb #172740;scroll-snap-type:x proximity;padding:4px 0 10px}
.trend-bars{--tick-width:68px;grid-auto-columns:var(--tick-width);gap:8px;min-width:max-content}
.trend-bars li{scroll-snap-align:start;grid-template-rows:22px 122px auto}
.trend-bars[data-unit="month"]{--tick-width:98px}
.trend-bars[data-unit="year"]{--tick-width:120px}
.trend-bars[data-unit="year"].static-years{grid-auto-columns:minmax(0,1fr);min-width:0}
.trend-track{background:#122540}
.trend-track span{background:linear-gradient(#cbb5ff,#789cec)}
.trend-nav{padding-top:3px}.trend-nav button{min-width:118px}

:root{--status-submitted:#9bb5e9;--status-in-progress:#f6c774;--status-waiting-on-customer:#d7a5ef;
--status-under-investigation:#f19ec0;--status-escalated:#ff8a87;--status-resolved:#73dfbd;--status-closed:#86c4ff}
.year-comparison{margin-bottom:14px;background:linear-gradient(140deg,#1d304a,#20243c)}
.wheel-card{background:#17243b;border:1px solid #4c6180;border-radius:14px;padding:16px;text-align:center}
.wheel{width:min(100%,190px);aspect-ratio:1;margin:auto;border-radius:50%;display:grid;place-items:center}
.wheel-center{width:66%;aspect-ratio:1;display:grid;place-content:center;background:#17243b;border-radius:50%}
.wheel-center b{font-size:24px}.wheel-center small{font-size:11px}.legend-dot{width:.72em;height:.72em;border-radius:50%;display:inline-block;margin-inline-end:7px}
.delta{font-variant-numeric:tabular-nums;font-weight:700}
.line-scroll{overflow:auto;min-width:0}.line-plot{min-width:620px}
.line-plot svg{display:block;width:100%;height:auto}.line-plot text{fill:#c6d5e9;font:13px system-ui,sans-serif}
.line-dates{position:relative;height:38px}
.line-dates button{position:absolute;transform:translateX(-50%);padding:6px 3px;font-size:11px;white-space:nowrap}.line-dates button[aria-pressed=true]{background:#215051;border-color:#7ce8cd}
.line-plot [data-chart-date]{cursor:pointer}
.line-nav{flex-wrap:wrap}.line-controls label.checkbox{display:flex;align-items:center;gap:6px}.line-controls .checkbox input{width:auto}
.trend-panel .row legend{padding:0 6px;color:var(--muted)}.line-controls{border:1px solid var(--line);border-radius:8px}

.comparison-grid{display:grid;grid-template-columns:minmax(150px,1fr) repeat(2,minmax(118px,155px)) minmax(140px,1fr);gap:10px;align-items:start}
.comparison-legend,.comparison-change{padding:10px;border:1px solid #4c6180;border-radius:10px;background:#17243b}
.comparison-legend ul,.comparison-change ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:5px}
.comparison-legend li,.comparison-change li{display:flex;align-items:baseline;justify-content:space-between;gap:5px;font-size:12px}
.comparison-legend small{white-space:nowrap;font-variant-numeric:tabular-nums}
.wheel-card{padding:8px;gap:4px;min-width:0}.wheel-graphic{display:block;width:100%;max-width:146px;margin:auto;overflow:visible}
.wheel-graphic text{fill:var(--ink);font:700 15px system-ui,sans-serif}.wheel-graphic text.slice-label{fill:#122033;font:800 9px system-ui,sans-serif;pointer-events:none}
.wheel-segment{cursor:pointer}.wheel-segment:focus-visible{outline:none;filter:brightness(1.25) drop-shadow(0 0 2px #fff)}
.wheel-segment.dimmed{opacity:.35}.wheel-inspect{min-height:3em;font-size:11px}
.line-controls-row{align-items:end}.line-controls-row form{align-items:end}
.line-plot{position:relative;min-width:0}.line-plot svg{height:170px;width:100%}
.line-plot [data-chart-date]{cursor:crosshair}.line-guide{pointer-events:none}
.line-dates button{min-height:32px}.line-inspect{min-height:72px}
@media(max-width:1050px){.comparison-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.comparison-legend,.comparison-change{grid-column:1/-1}.comparison-legend ul,.comparison-change ul{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}}
@media(max-width:390px){.comparison-legend ul,.comparison-change ul{grid-template-columns:1fr}}

.comparison-detail-table{table-layout:fixed;width:100%;font-variant-numeric:tabular-nums}
.comparison-detail-table col:first-child{width:46%}
.comparison-detail-table col:not(:first-child){width:18%}
.comparison-detail-table th:not(:first-child),.comparison-detail-table td{text-align:right}
.comparison-detail-section{display:grid;gap:6px;margin-top:12px}
.comparison-detail-section+.comparison-detail-section{margin-top:2rem}
.comparison-detail-table tfoot th,.comparison-detail-table tfoot td{font-weight:700;color:var(--ink)}

body::after{content:"";position:fixed;inset:-14%;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 22% 28%,#379ab538,transparent 39%),radial-gradient(ellipse at 78% 50%,#9962cf3b,transparent 42%);animation:relay-drift 24s ease-in-out infinite alternate;transform-origin:50% 50%}
@keyframes relay-drift{to{transform:translate(5%,-5%) scale(1.12)}}
@media(prefers-reduced-motion:reduce){body::after{animation:none}}
.top{background:linear-gradient(110deg,#172f49,#1c2340 65%,#2b2241);border-color:#54678a;min-height:77px}
.relay-brand-mark{width:92px;display:grid;place-items:center;padding-right:10px;border-right:1px solid #617591}
.relay-brand-mark svg{width:100%;height:auto;display:block}
.brand strong{font-size:20px;letter-spacing:-.035em}.brand strong span{font-size:13px;color:#a9e9da;letter-spacing:0}
.comparison-grid{grid-template-columns:minmax(146px,.9fr) repeat(2,minmax(144px,1.1fr)) minmax(160px,1fr);gap:8px;align-items:start}
.wheel-graphic{max-width:212px;filter:drop-shadow(0 7px 7px #070d1d70)}
.wheel-card{padding:8px 5px}.comparison-change li>span:last-child{text-align:right}.relative-change{display:inline-block;margin-inline-start:4px}
.line-controls-row form:last-child{margin-inline-start:auto}
@media(max-width:1000px){.comparison-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){.relay-brand-mark{width:65px}.brand strong{font-size:17px}.comparison-detail-table .relative-change{display:block}}
</style>

    const a=accounts.find(row=>row.id===id&&row.role!=="Admin");
    if(!a)return;
    a.active=!a.active;
    record("Access change","Accounts preview",a.active?"access_restored":"access_suspended");
    render();q('[data-action="access:'+id+'"]')?.focus();
    alert(a.id+(a.active?" restored.":" suspended."));
  }
});
document.addEventListener("submit",event=>{
  event.preventDefault();
  const form=event.target, data=Object.fromEntries(new FormData(form));
  if(form.id==="login"){
    const account=accounts.find(a=>a.id===data.account.trim().toLowerCase()&&a.active);
    if(account)setRole(account.role,account);
    else alert("Demo username unavailable. Check the synthetic username and try again.");
  }
  if(form.id==="year-compare" && tab==="Analytics" && [2024,2025,2026].includes(Number(data.year))){
    compareYear=Number(data.year);render();q("#year-compare select")?.focus();
  }
  if(form.id==="trend-jump" && tab==="Analytics"){
    const [from,to]=trendBounds();
    if(data.date<from || data.date>to) return;
    const key=bucketKey(data.date,trendUnit);
    const index=trendData(trendUnit).findIndex(([date])=>date===key);
    if(index<0) return;
    const scroller=q("#line-scroll");
    if(scroller && !(trendUnit==="year"&&timeline.length<=10)){
      scroller.scrollLeft=Math.floor(index/(trendUnit==="day"?7:1))*(trendUnit==="day"?7:1)*timelineWidth();
      updateTrendRange();
    }
    q('[data-action="pin:'+key+'"]')?.focus({preventScroll:true});
    pinTrend(key);
  }
  if(form.id==="trend-settings" && tab==="Analytics"){
    if(!calendarUnits.some(([unit])=>unit===data.unit)) return;
    trendUnit=data.unit;trendOffset=null;pinnedDate="";
    render();q("#trend-settings select")?.focus();
    alert("Chart grouped by "+trendUnit+".");
  }
  if(form.id==="filters"){
    if(data.calendar && !data.anchor){alert("Choose a calendar reference date for the selected period.");return;}
    if(data.from && data.to && data.from>data.to){alert("Choose a through date on or after the from date.");return;}
    filter=data;page=0;trendOffset=null;pinnedDate="";render();q('#filters button')?.focus();alert(results().length+" matching cases.");
  }
  if(form.id==="request" && role==="User"){
    const title=data.title.trim(), request=data.request.trim();
    if(!title||!request){alert("Enter both a subject and an issue description.");return;}
    if(edit && edit.status==="Submitted"){
      if(edit.response==="w2" && normalizeRequest(request)!==normalizeRequest(edit.request)){
        Object.assign(edit,{response:undefined,category:"Unclassified",issue:"Pending classification"});
      }
      Object.assign(edit,{title,request});
      alert("Request updated.");
    }
    else if(!edit){
      const id="SYN-DEMO-"+String(++serial).padStart(3,"0");
      const ticket={id,title,request,category:"Unclassified",issue:"Pending classification",band:"Unknown",
        timestamp:baseTime+serial,date:"2026-11-10",owner:"user.demo",assignee:"",status:"Submitted",reviewHours:0};
      const outcome=routeFormRequest(ticket);
      ticket.lifecycle=ticket.status==="Resolved"?[{status:"Resolved",date:ticket.date}]:[];
      cases.push(ticket);
      alert(id+" submitted. "+outcome);
    }
    go("My requests");
  }
  if(form.dataset?.feedback && role==="Admin" && tab==="Auditor activity" && !selected){
    const target=classificationEntries().find(({entry})=>String(entry.sequence)===form.dataset.feedback)?.entry;
    if(!target || target.override) return;
    const note=data.note.trim();
    const flagged=data.flag==="on";
    if(!note && flagged===Boolean(target.flagged)){alert("Write a note or change the flag before saving.");return;}
    const flagChanged=flagged!==Boolean(target.flagged);
    if(note){
      target.feedback ??= [];
      target.feedback.push({author:signedIn.id,time:new Date().toISOString(),text:note.slice(0,800)});
      record("Auditor feedback","Auditor preview","note_sent");
    }
    if(flagChanged){
      target.flagged=flagged;
      record("Auditor feedback","Auditor preview",flagged?"decision_flagged":"decision_unflagged");
    }
    render();
    const savedForm=q("#feedback-"+target.sequence);
    if(savedForm){
      const disclosure=savedForm.closest("details");
      const history=disclosure.parentElement.closest("details");
      if(history) history.open=true;
      disclosure.querySelector("summary")?.focus();
    }
    alert(note?"Note sent to "+target.actor+(flagChanged?(flagged?". Decision flagged.":". Flag cleared."):"."):flagged?"Decision flagged.":"Flag cleared.");
  }
  if(form.id==="case-audit" && canAudit()){
    const c=scoped().find(row=>row.id===selected);
    if(!mayRecordClassification(c)) return;
    const reason=data.reason.trim();
    if(!auditCategories.includes(data.category) || !bands.slice(0,3).includes(data.band) || !reason){
      alert("Choose a category and band, then explain your decision.");
      return;
    }
    if(c.category===data.category && c.band===data.band){alert("Choose a different category or band to save a revision.");return;}
    const history=c.classificationHistory ??= [];
    const revision=history.length>0;
    history.push({version:history.length+1,sequence:++classificationSequence,beforeCategory:c.category,beforeBand:c.band,
      category:data.category,band:data.band,reason:reason.slice(0,800),
      actor:signedIn.id,override:role==="Admin",time:new Date().toISOString()});
    c.category=data.category;
    c.band=data.band;
    if(c.issue==="Pending classification") c.issue="Auditor classified";
    record("Classification change","Auditor preview",role==="Admin"?"admin_classification_override":revision?"classification_revised":"classification_confirmed");
    form.remove();
    render();focusHeading();
    alert(revision?"Revision saved. Earlier decisions remain in history.":"Classification saved. The case left the Auditor queue. Its status and assignee are unchanged.");
  }
  if(form.id==="case-review" && !isAuditor() && (role==="Staff" || role==="Admin")){
    const c=scoped().find(row=>row.id===selected);
    if(!c || c.status==="Closed") return;
    const next=data.nextStatus;
    if(needsClassification(c) && isTerminalChoice(next)){alert("Classify the case before resolving or closing it.");return;}
    if(next && !statusTransitions[c.status].includes(next)){alert("This status change is unavailable.");return;}
    c.reviewNote=data.note.trim().slice(0,1600);
    if(next){
      c.statusHistory ??= [];
      c.statusHistory.unshift({actor:signedIn.id,before:c.status,after:next,time:new Date().toISOString()});
      c.status=next;
      (c.lifecycle ??= []).push({status:next,date:isoDate(baseTime)});
      c.reviewHours=0;
    }
    form.remove();
    render();
    if(next==="Closed") focusHeading();
    else q("#case-review button")?.focus();
    alert(next?"Review saved. Status changed to "+next+".":"Review note saved.");
  }
  if(form.id==="assign" && role==="Admin"){
    const c=scoped().find(row=>row.id===selected);
    if(!c || c.assignee===data.assignee){alert("Assignment is unchanged.");return;}
    if(data.assignee && !accounts.some(a=>a.active&&a.role==="Staff"&&a.id===data.assignee))return;
    const prior=c.assignee;
    c.assignee=data.assignee;
    assignmentHistory.unshift({id:c.id,actor:"admin.demo",before:prior,after:c.assignee,time:new Date().toISOString().replace("T"," ").slice(0,19)});
    record("Assignment change","Queue preview",prior ? (c.assignee?"case_reassigned":"case_unassigned") : "case_assigned");
    render();q("#assign button")?.focus();alert("Assignment saved in the preview.");
  }
});
render();
</script>
</body>
</html>
