[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cdit-support-mao"
version = "0.1.0"
description = "Synthetic-data prototype foundation for the CDIT Support Desk MAO"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "anthropic==2.5.0",
    "python-dotenv==1.2.4",
    "pydantic>=2.10,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
cdit_support_mao = ["migrations/*.sql", "static/*"]
